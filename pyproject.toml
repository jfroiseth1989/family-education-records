[project]
name = "ferpa-evidence-manager"
version = "0.1.0"
description = "Private, local-first FERPA evidence-management application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4,<3.0",
    "pymupdf>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "striprtf>=0.0.26,<1.0",
    "pytesseract>=0.3.10,<1.0",
    "argon2-cffi>=23.1,<26.0",
    "keyring>=25.0,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
