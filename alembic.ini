[alembic]
script_location = app/db/migrations
prepend_sys_path = .
path_separator = os

# The actual database URL is set programmatically at runtime (see
# app/db/migrate.py) from the resolved vault path, never hardcoded here --
# there is no single "the" database file, since each vault has its own.
sqlalchemy.url = sqlite:///./placeholder-unused.sqlite

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
